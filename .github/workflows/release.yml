name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo check --locked

  bundle-linux:
    name: Linux AppImage and deb
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y fuse libfuse2
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked
      - name: Build AppImage
        run: cargo bundle --format appimage --release
      - name: Build deb
        run: cargo bundle --format deb --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

  bundle-macos:
    name: macOS DMG
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked
      - name: Build DMG
        run: cargo bundle --format dmg --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: target/release/bundle/dmg/*.dmg

  bundle-windows:
    name: Windows EXE installer and MSI
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked
      - name: Build EXE installer
        run: cargo bundle --format exe --release
      - name: Build MSI
        run: cargo bundle --format msi --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/bundle/exe/*.exe
            target/release/bundle/msi/*.msi

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle-linux, bundle-macos, bundle-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate checksums
        run: find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
